[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cola-code"
version = "0.1.0"
description = "Three-stage COLA training pipeline for collaborative object carrying with a Unitree G1"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.12"
classifiers = ["License :: OSI Approved :: MIT License"]

[tool.setuptools.packages.find]
include = ["legged_lab*"]

[tool.ruff]
line-length = 120
target-version = "py311"
